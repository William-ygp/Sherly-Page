<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#07070B" />
    <meta name="color-scheme" content="dark" />
    <title>Para Ti</title>
  </head>
  <body class="bg-base text-text-main font-sans antialiased overflow-x-hidden selection:bg-accent-gold/25 selection:text-text-main">
    <!-- SVG Filter for optional Chromium Liquid Glass Refraction -->
    <svg class="sr-only" aria-hidden="true" width="0" height="0">
      <defs>
        <filter id="liquid-displacement" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
